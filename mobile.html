<!DOCTYPE html>
<html lang="ja">

<head>
    <meta charset="UTF-8">
    <meta name="viewport"
        content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>CataBooks Mobile</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link
        href="https://fonts.googleapis.com/css2?family=Noto+Sans+JP:wght@400;500;700&family=Roboto:wght@500;700&display=swap"
        rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="stylesheet" href="mobile.css">
</head>

<body>
    <div class="app-container">
        <!-- Top Header (Sticky) -->
        <header class="app-header">
            <div class="search-wrapper">
                <i class="fa-solid fa-magnifying-glass search-icon"></i>
                <input type="text" id="searchInput" placeholder="教材名・キーワード検索" autocomplete="off">
                <button id="clearSearchBtn" class="clear-btn" style="display: none;"><i
                        class="fa-solid fa-circle-xmark"></i></button>
            </div>
            <div class="filter-scroll">
                <button class="chip active" data-filter="all">すべて</button>
                <button class="chip" data-filter="elementary">小学生</button>
                <button class="chip" data-filter="junior">中学生</button>
                <button class="chip" data-filter="high">高校生</button>
                <div class="divider"></div>
                <button class="chip" data-filter="english">英語</button>
                <button class="chip" data-filter="math">数学</button>
                <button class="chip" data-filter="japanese">国語</button>
                <button class="chip" data-filter="science">理科</button>
                <button class="chip" data-filter="social">社会</button>
            </div>
        </header>

        <!-- Main Scrollable Content -->
        <main class="main-content" id="mainContent">
            <!-- Student Selector Banner (Sticky below header or static) -->
            <div class="student-banner" id="studentBanner">
                <div class="current-student">
                    <span class="label">対象生徒:</span>
                    <span class="student-name" id="currentStudentName">未選択</span>
                </div>
                <button class="btn-sm" id="changeStudentBtn">変更</button>
            </div>

            <div class="item-list" id="itemList">
                <!-- Items injected here -->
            </div>

            <!-- Spacer for bottom nav -->
            <div style="height: 80px;"></div>
        </main>

        <!-- Bottom Navigation -->
        <nav class="bottom-nav">
            <button class="nav-item active" data-tab="home">
                <i class="fa-solid fa-house"></i>
                <span>ホーム</span>
            </button>
            <button class="nav-item" data-tab="favorites">
                <i class="fa-solid fa-star"></i>
                <span>お気に</span>
            </button>
            <button class="nav-item cart-nav-item" data-tab="cart">
                <div class="icon-wrapper">
                    <i class="fa-solid fa-cart-shopping"></i>
                    <span class="badge" id="cartBadge" style="display: none;">0</span>
                </div>
                <span>カート</span>
            </button>
            <button class="nav-item" data-tab="menu">
                <i class="fa-solid fa-bars"></i>
                <span>メニュー</span>
            </button>
        </nav>
    </div>

    <!-- Modals -->

    <!-- Student Selection Modal -->
    <div class="sheet-overlay" id="studentModal">
        <div class="bottom-sheet">
            <div class="sheet-header">
                <h3>生徒を選択</h3>
                <button class="close-sheet"><i class="fa-solid fa-xmark"></i></button>
            </div>
            <div class="sheet-body">
                <button class="btn-create-new" id="createNewStudentBtn">
                    <i class="fa-solid fa-user-plus"></i> 新しい生徒を登録
                </button>
                <div class="student-list" id="studentList">
                    <!-- Students injected here -->
                </div>
            </div>
        </div>
    </div>

    <!-- New Student Input Modal (Nested or separate) -->
    <div class="modal-overlay" id="newStudentModal">
        <div class="modal-box">
            <h3>生徒登録</h3>
            <div class="form-group">
                <label>氏名</label>
                <input type="text" id="newStudentNameInput" placeholder="山田 太郎">
            </div>
            <div class="form-group">
                <label>学年 (任意)</label>
                <input type="text" id="newStudentGradeInput" placeholder="中3">
            </div>
            <div class="modal-actions">
                <button class="btn-cancel" id="cancelNewStudentBtn">キャンセル</button>
                <button class="btn-save" id="saveNewStudentBtn">登録</button>
            </div>
        </div>
    </div>

    <!-- Item Detail Modal -->
    <div class="modal-overlay" id="detailModal">
        <div class="modal-box detail-box">
            <div class="detail-header">
                <div class="detail-badges" id="detailBadges"></div>
                <button class="close-detail"><i class="fa-solid fa-xmark"></i></button>
            </div>
            <h2 id="detailTitle">教材タイトル</h2>
            <div class="detail-prices">
                <div class="price-row retail">
                    <span>販売価格 (税込)</span>
                    <strong id="detailRetail">¥0</strong>
                </div>
                <div class="price-row wholesale">
                    <span>仕入価格 (税込)</span>
                    <span id="detailWholesale">¥0</span>
                </div>
            </div>
            <div class="detail-actions">
                <button class="btn-fav" id="detailFavBtn"><i class="fa-regular fa-star"></i></button>
                <button class="btn-add-cart" id="detailAddCartBtn">カートに追加</button>
            </div>
        </div>
    </div>

    <!-- Menu / Settings Modal -->
    <div class="sheet-overlay" id="menuModal">
        <div class="bottom-sheet">
            <div class="sheet-header">
                <h3>メニュー</h3>
                <button class="close-sheet"><i class="fa-solid fa-xmark"></i></button>
            </div>
            <div class="sheet-body menu-list">
                <button class="menu-item" id="menuHistory"><i class="fa-solid fa-clock-rotate-left"></i> 履歴</button>
                <button class="menu-item" id="menuSettings"><i class="fa-solid fa-gear"></i> 設定</button>
                <button class="menu-item danger" id="menuReset"><i class="fa-solid fa-trash-can"></i> データリセット</button>
            </div>
        </div>
    </div>

    <!-- Settings Modal -->
    <div class="modal-overlay" id="mobileSettingsModal" role="dialog" aria-modal="true" hidden
        aria-labelledby="mobileSettingsTitle" aria-describedby="mobileSettingsDescription">
        <div class="modal-box settings-box">
            <h3 id="mobileSettingsTitle">設定</h3>
            <p class="modal-description" id="mobileSettingsDescription">見積書に表示する教室情報と送料を設定します。</p>

            <div class="form-group">
                <label for="mobileSettingSchoolName">教室名</label>
                <input type="text" id="mobileSettingSchoolName" autocomplete="organization">
            </div>
            <div class="form-group">
                <label for="mobileSettingAddress">郵便番号・住所</label>
                <textarea id="mobileSettingAddress" rows="3" autocomplete="street-address"></textarea>
            </div>
            <div class="form-group">
                <label for="mobileSettingPhone">電話番号</label>
                <input type="tel" id="mobileSettingPhone" autocomplete="tel">
            </div>
            <div class="form-group">
                <label for="mobileSettingTaxRate">消費税率（0.10 = 10%）</label>
                <input type="number" id="mobileSettingTaxRate" min="0" max="1" step="0.01" inputmode="decimal">
            </div>
            <div class="form-group">
                <label for="mobileSettingShippingFee">設定送料（税込）</label>
                <div class="mobile-input-with-unit">
                    <input type="number" id="mobileSettingShippingFee" min="0" step="1" inputmode="numeric"
                        placeholder="0">
                    <span>円</span>
                </div>
                <p class="field-help">生徒1人の見積書につき1回加算します。作成時にオン／オフを選べます。</p>
            </div>

            <div class="modal-actions">
                <button class="btn-cancel" id="cancelMobileSettingsBtn" type="button">キャンセル</button>
                <button class="btn-save" id="saveMobileSettingsBtn" type="button">保存</button>
            </div>
        </div>
    </div>

    <!-- Quotation Options Modal -->
    <div class="modal-overlay" id="mobileQuoteOptionsModal" role="dialog" aria-modal="true" hidden
        aria-labelledby="mobileQuoteOptionsTitle" aria-describedby="mobileQuoteOptionNote">
        <div class="modal-box quote-options-box">
            <h3 id="mobileQuoteOptionsTitle">見積書を作成</h3>
            <p class="modal-description" id="mobileQuoteStudentName"></p>

            <div class="quote-summary-box" aria-live="polite">
                <div class="quote-summary-row">
                    <span>教材小計</span>
                    <strong id="mobileQuoteItemsSubtotal">¥0</strong>
                </div>
                <label class="quote-shipping-option" for="mobileQuoteIncludeShipping">
                    <span class="quote-shipping-copy">
                        <strong>設定送料を含める</strong>
                        <small id="mobileQuoteShippingDescription">設定送料 ¥0（税込）</small>
                    </span>
                    <input type="checkbox" id="mobileQuoteIncludeShipping">
                    <span class="toggle-switch" aria-hidden="true"></span>
                </label>
                <div class="quote-summary-row total">
                    <span>見積合計（税込）</span>
                    <strong id="mobileQuoteGrandTotal">¥0</strong>
                </div>
            </div>
            <p class="quote-option-note" id="mobileQuoteOptionNote">送料は今回の見積書だけに反映され、仕入・発注用集計には含まれません。</p>

            <div class="modal-actions">
                <button class="btn-cancel" id="cancelMobileQuoteBtn" type="button">キャンセル</button>
                <button class="btn-save" id="confirmMobileQuoteBtn" type="button">この内容で作成</button>
            </div>
        </div>
    </div>

    <script src="https://cdn.sheetjs.com/xlsx-0.20.0/package/dist/xlsx.full.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="supabase-client.js"></script>
    <script src="quote-utils.js"></script>
    <script src="mobile.js"></script>
</body>

</html>
